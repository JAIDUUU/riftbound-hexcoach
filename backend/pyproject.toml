[project]
name = "backend"
version = "0.1.0"
description = "HexCoach backend: a Riftbound rules coach."
readme = "README.md"
authors = [
    { name = "Leonardo Almeida Farias", email = "113396827+leofarias-cpu@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastembed>=0.9.1",
    "langchain>=1.4.9",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.2.0",
    "langchain-openai>=1.8.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
backend = "backend.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Integration tests touch the database behind DATABASE_URL, so they never run by accident:
# they must be asked for with `pytest -m integration` (and still skip without DATABASE_URL).
addopts = '-m "not integration"'
markers = ["integration: needs a real database (DATABASE_URL); deselected unless -m integration"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
